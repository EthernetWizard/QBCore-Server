# ─────────────────────────────────────────────────────────────────
#  StabCity AI Society - QBCore Server Configuration
# ─────────────────────────────────────────────────────────────────
# Copy this file to server.cfg and fill in your real values.

# ─── Admin Access (must be before resource loading) ─────────────
add_ace group.admin command allow
add_principal identifier.steam:YOUR_STEAM_HEX group.admin

# Server Identity
sets sv_projectName "StabCity AI Society"
sets sv_projectDesc "AI-Powered NPCs on QBCore"

# CFX.re License Key
sv_licenseKey "YOUR_LICENSE_KEY_HERE"

# ─── MySQL Connection ────────────────────────────────────────────
set mysql_connection_string "mysql://root:YOUR_PASSWORD@localhost/qbcore"

# ─── Performance ─────────────────────────────────────────────────
sv_maxclients 32
set onesync on
set sv_enforceGameBuild 2944

# ─── Network ─────────────────────────────────────────────────────
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_master1 ""

# ─── Core FiveM Resources ────────────────────────────────────────
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

# ─── Database Driver (must load before QBCore) ────────────────────
ensure oxmysql

# ─── Standalone Dependencies ─────────────────────────────────────
ensure PolyZone
ensure menuv
ensure ox_lib
ensure community_bridge
ensure ate_balloon

# ─── QBCore Framework (load order matters!) ───────────────────────
ensure qb-core

# QBCore UI & Utility
ensure qb-multicharacter
ensure qb-spawn
ensure qb-interior
ensure qb-apartments
ensure qb-clothing
ensure qb-hud
ensure qb-radialmenu
ensure qb-adminmenu
ensure qb-smallresources
ensure qb-weathersync
ensure qb-weapons

# QBCore Interaction & UI
ensure qb-target
ensure qb-menu
ensure qb-input
ensure qb-inventory
ensure qb-phone
ensure qb-banking
ensure qb-shops

# ─── Custom Vehicles ────────────────────────────────────────────
ensure rs615
ensure boostlam
ensure filthynsx
ensure filthynsx_a
ensure filthynsx_v
ensure bmwhommage_d

# ─── MD-Drugs ───────────────────────────────────────────────────
ensure md-drugs

# ─── StabCity AI Agents ──────────────────────────────────────────
ensure qb-stabcityai
